[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "superlink2mqtt"
version = "0.1.0"
description = "SuperLink sensor gateway and MQTT bridge"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pysodium>=0.7.18,<0.8", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]
test = ["pytest>=9,<10", "hypothesis==6.169.0", "PyNaCl>=1.6,<2", "websockets>=16,<17"]

[project.scripts]
superlink-bridged = "superlink.bridge.runtime:main"
superlink-gw = "superlink.gateway:main"
superlink-sniff = "superlink.cli:main"

[tool.setuptools.packages.find]
where = ["tools/sx1302"]
include = ["superlink*"]

[tool.setuptools.package-data]
"superlink.bridge" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mqtt_broker: integration tests requiring a local mosquitto executable"]
