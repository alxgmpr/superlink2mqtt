[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "superlink2mqtt"
version = "0.2.5"
description = "Local SuperLink sensor gateway with MQTT discovery and a management UI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pysodium==0.7.18", "PyYAML==6.0.3", "paho-mqtt==2.1.0", "paramiko==4.0.0"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "hypothesis==6.169.0", "PyNaCl>=1.6,<2", "websockets>=16,<17"]
extraction-build = ["ziglang==0.14.1"]

[project.scripts]
superlink-bridged = "superlink.bridge.runtime:main"
superlink-gw = "superlink.gateway:main"
superlink-sniff = "superlink.cli:main"
superlink-control = "superlink.bridge.control:main"

[tool.setuptools.packages.find]
where = ["tools/sx1302"]
include = ["superlink*"]

[tool.setuptools.package-data]
"superlink.bridge" = ["profiles/*.yaml", "frontend/*.html", "frontend/*.css", "frontend/*.js"]

"superlink.bridge.extraction" = ["native/*.c", "native/*.sh", "native/*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mqtt_broker: integration tests requiring a local mosquitto executable"]

[tool.ruff]
target-version = "py312"
# Lint the bridge package, the HA app and the tests. The reverse-engineering
# scripts (Ghidra/Jython, one-off crackers, capture tools) are not held to it.
extend-exclude = [
    "tools/decoder", "tools/ghidra_scripts", "tools/grant_crack", "tools/keyhook",
    "tools/mock_controller", "tools/sdr", "tools/sensor_swd", "tools/sniffer",
    "tools/sx1302/command_probe.py",
]

[tool.ruff.lint]
select = ["E9", "F"]
