name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-python-lean:
    name: Python tests and Lean verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev build-essential
          python -m pip install -r requirements-test.txt
      - name: Run Python tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: python -m pytest tests/ -q --hypothesis-show-statistics
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend HTTP error handling
        run: node --test tests/test_frontend_*.cjs
      - name: Cross-compile the ARM gateway capture helper
        run: |
          python -m pip install ziglang==0.14.1
          PYTHONPATH=tools/sx1302 python -c 'from superlink.bridge.extraction.build import build_helper; assert build_helper()'
      - name: Build and check the installable gateway package
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/superlink-wheels"
          python -m pip install --no-deps "$RUNNER_TEMP"/superlink-wheels/*.whl
          cd "$RUNNER_TEMP"
          superlink-bridged --help
          python -c 'from superlink.bridge.profiles import ProfileRegistry; ProfileRegistry.load(); from superlink.bridge.web import ASSETS; assert all((ASSETS / name).is_file() for name in ("index.html", "app.js", "onboarding.js", "request.js", "style.css")); from superlink.bridge.extraction.build import NATIVE; assert all((NATIVE / name).is_file() for name in ("capture.c", "run.sh", "restore.sh", "watchdog.sh"))'
      - name: Cache pinned Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain') }}
      - name: Install elan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/elan"
          gh release download v4.2.4 --repo leanprover/elan --pattern elan-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan/elan-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
      - name: Check Lean proofs and Python correspondence
        run: python tools/check_lean.py

  sniffer-build:
    name: Build sniffer firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO core
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-core-${{ runner.os }}-${{ hashFiles('tools/sniffer/platformio.ini') }}
          restore-keys: |
            pio-core-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-platformio

      - name: Cache sniffer build dir
        uses: actions/cache@v4
        with:
          path: tools/sniffer/.pio/build
          key: pio-build-${{ runner.os }}-${{ hashFiles('tools/sniffer/platformio.ini', 'tools/sniffer/src/**') }}
          restore-keys: |
            pio-build-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        working-directory: tools/sniffer
        run: pio run

  docs-lint:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "docs/**/*.md *.md"
