name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bridge-tests:
    name: Bridge tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev mosquitto
      - name: Install bridge and test dependencies
        run: python -m pip install '.[mqtt,test]'
      - name: Test
        env:
          HYPOTHESIS_PROFILE: ci
        run: python -m pytest
      - name: Verify installed package outside checkout
        working-directory: /tmp
        run: |
          python -c 'from superlink.bridge.profiles import ProfileRegistry; ProfileRegistry.load()'
          superlink-bridged --help
          superlink-gw --help
          superlink-sniff --help

  sniffer-build:
    name: Build sniffer firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO core
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-core-${{ runner.os }}-${{ hashFiles('tools/sniffer/platformio.ini') }}
          restore-keys: |
            pio-core-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-platformio

      - name: Cache sniffer build dir
        uses: actions/cache@v4
        with:
          path: tools/sniffer/.pio/build
          key: pio-build-${{ runner.os }}-${{ hashFiles('tools/sniffer/platformio.ini', 'tools/sniffer/src/**') }}
          restore-keys: |
            pio-build-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        working-directory: tools/sniffer
        run: pio run

  docs-lint:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "docs/**/*.md *.md"
