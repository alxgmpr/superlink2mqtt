name: superlink2mqtt
slug: superlink2mqtt
version: "0.2.5"
description: SuperLink sensors over a remote SX1302 radio
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
watchdog: "tcp://[HOST]:8099"
panel_icon: mdi:radio-tower
panel_title: superlink2mqtt
services:
  - mqtt:want
map:
  - type: app_config
    read_only: false
    path: /config
options:
  radio_host: ""
  radio_user: alex
  radio_port: 22
schema:
  radio_host: str
  radio_user: str
  radio_port: port
